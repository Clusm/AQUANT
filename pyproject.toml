[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents-quant"
version = "0.3.0"
description = "A股多Agent投研框架 — 量化前置筛选 + LLM 深度分析双层架构"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "simonlin1212", email = "simonlin1212@users.noreply.github.com"},
]
dependencies = [
    "langchain-core>=0.3.81",
    "langchain-anthropic>=0.3.15",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=80.9.0",
    "stockstats>=0.6.5",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
    "streamlit>=1.45.0,<1.58",
    "fpdf2>=2.8.6",
    "python-dotenv>=1.1.0",
    "mootdx>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/simonlin1212/TradingAgents-astock"
Repository = "https://github.com/simonlin1212/TradingAgents-astock"
Issues = "https://github.com/simonlin1212/TradingAgents-astock/issues"
Upstream = "https://github.com/TauricResearch/TradingAgents"
Changelog = "https://github.com/simonlin1212/TradingAgents-astock/blob/main/CHANGELOG.md"

[project.optional-dependencies]
google = ["langchain-google-genai>=4.0.0"]
test = ["pytest>=7.4"]

[project.scripts]
tradingagents = "cli.main:app"
tradingagents-web = "web.launch:main"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "web*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
