[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents-quant"
version = "0.4.0"
description = "A股多Agent投研框架 — 量化前置筛选 + LLM 深度分析双层架构"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Clusm", email = "clusm@users.noreply.github.com"},
]
dependencies = [
    "langchain-core>=0.3.81",
    "langchain-anthropic>=0.3.15",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "akshare>=1.16",
    "pandas>=2.3.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "python-dateutil>=2.9",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=80.9.0",
    "stockstats>=0.6.5",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
    "streamlit>=1.45.0,<1.58",
    "fpdf2>=2.8.6",
    "python-dotenv>=1.1.0",
    "mootdx>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/Clusm/AQUANT"
Repository = "https://github.com/Clusm/AQUANT"
Issues = "https://github.com/Clusm/AQUANT/issues"
Upstream = "https://github.com/TauricResearch/TradingAgents"
Changelog = "https://github.com/Clusm/AQUANT/blob/main/CHANGELOG.md"

[project.optional-dependencies]
google = ["langchain-google-genai>=4.0.0"]
quant-data = ["adata>=2.9"]
test = ["pytest>=7.4"]

[project.scripts]
tradingagents = "cli.main:app"
tradingagents-web = "web.launch:main"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "web*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E402", "E501", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"tradingagents/agents/utils/agent_utils.py" = ["F401"]  # 工具函数集中 re-export
"tradingagents/dataflows/alpha_vantage.py" = ["F401"]   # vendor 工具集中 re-export
"scripts/archive/*" = ["E402", "E741", "F401", "F841"]
